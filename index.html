        // Decode Base64 and convert to binary string
        const binaryString = atob(base64ExcelData);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }

        // Read the binary string as a workbook using XLSX
        const workbook = XLSX.read(bytes, { type: 'array' });

        // Convert the first worksheet to JSON
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(worksheet);

        // Build DOM nodes with textContent so spreadsheet values are never parsed as HTML
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined && text !== null) node.textContent = text;
            return node;
        }

        const criteriaSet = new Set();
        data.forEach(item => criteriaSet.add(item['Selection Criteria']));
        const selectionCriteriaContainer = document.getElementById('selectionCriteria');

        let criteriaIndex = 0;
        criteriaSet.forEach(criteria => {
            const id = `criteria-${criteriaIndex++}`;
            const col = el('div', 'col');
            const wrap = el('div', 'form-check');
            const input = el('input', 'form-check-input');
            input.type = 'checkbox';
            input.value = criteria;
            input.id = id;
            const label = el('label', 'form-check-label', criteria);
            label.htmlFor = id;
            wrap.append(input, label);
            col.append(wrap);
            selectionCriteriaContainer.append(col);
        });

        document.getElementById('filterBtn').addEventListener('click', () => {
            const selectedCriteria = Array.from(document.querySelectorAll('#selectionCriteria input:checked')).map(input => input.value);
            const resultContainer = document.getElementById('results');
            resultContainer.replaceChildren();

            if (selectedCriteria.length === 0) {
                resultContainer.append(el('p', null, 'Please select at least one criterion.'));
                return;
            }

            const filteredData = data.filter(item => selectedCriteria.includes(item['Selection Criteria']));

            // Group by software to aggregate selection criteria tags
            const groupedData = {};
            filteredData.forEach(item => {
                if (!groupedData[item.Software]) {
                    groupedData[item.Software] = {
                        ...item,
                        criteria: new Set()
                    };
                }
                groupedData[item.Software].criteria.add(item['Selection Criteria']);
            });

            // Sort by priority (missing/non-numeric last), then by price, then by name
            const num = (v, fallback) => {
                const n = parseFloat(v);
                return Number.isNaN(n) ? fallback : n;
            };
            const sortedData = Object.values(groupedData).sort((a, b) =>
                num(a.Priority, Infinity) - num(b.Priority, Infinity) ||
                num(a.Price, Infinity) - num(b.Price, Infinity) ||
                String(a.Software).localeCompare(String(b.Software))
            );

            // Display each filtered software option with aggregated selection criteria
            const fragment = document.createDocumentFragment();
            sortedData.forEach(item => {
                const card = el('div', 'border border-gray rounded p-3 mb-2');

                const header = el('div', 'd-flex align-items-center');
                const imgCol = el('div', 'col');
                imgCol.style.maxWidth = '200px';
                const img = el('img', 'mb-2 me-3');
                img.src = item.piclink || '';
                img.alt = `${item.Software} picture`;
                img.loading = 'lazy';
                img.style.cssText = 'width: 100%; height: 200px; object-fit: cover; object-position: center;';
                img.addEventListener('error', () => { img.style.visibility = 'hidden'; });
                imgCol.append(img);
                header.append(imgCol, el('div', `priority-${parseInt(item.Priority, 10) || 3} ms-3`, item.Software));
                card.append(header);

                item.criteria.forEach(c => card.append(el('div', 'badge rounded-pill text-bg-secondary mb-1 me-1', c)));

                card.append(
                    el('div', null, item.Details),
                    el('div', null, `Age: ${item.Age}`),
                    el('div', 'py-2', `Net Price: € ${item.Price}`),
                    el('div', 'text-secondary', item['Full Text'])
                );
                fragment.append(card);
            });
            resultContainer.append(fragment);
        });

        document.getElementById('startOverBtn').addEventListener('click', () => {
            document.querySelectorAll('#selectionCriteria input').forEach(input => input.checked = false);
            document.getElementById('results').replaceChildren();
        });
    </script>
</body>
</html>
